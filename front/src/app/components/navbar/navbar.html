<header class="navbar">
  <div class="interior" (appClickAfuera)="menuAbierto.set(false)">
    <a [routerLink]="auth.logueado() ? '/publicaciones' : '/login'" class="logo">
      <img src="favicon.svg" alt="" width="32" height="32" />
      <span>Red Social</span>
    </a>

    <button
      class="hamburguesa"
      (click)="menuAbierto.set(!menuAbierto())"
      [attr.aria-expanded]="menuAbierto()"
      aria-label="Abrir menú"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav [class.abierto]="menuAbierto()" (click)="menuAbierto.set(false)">
      @if (auth.usuario(); as usuario) {
        <a routerLink="/publicaciones" routerLinkActive="activo">Publicaciones</a>
        <a routerLink="/mi-perfil" routerLinkActive="activo">Mi perfil</a>

        @if (auth.esAdmin()) {
          <a routerLink="/dashboard/usuarios" routerLinkActive="activo">Usuarios</a>
          <a routerLink="/dashboard/estadisticas" routerLinkActive="activo">Estadísticas</a>
        }

        <span class="usuario">
          <app-avatar
            [url]="usuario.imagenPerfil"
            [nombre]="usuario.nombre"
            [apellido]="usuario.apellido"
            [tamanio]="30"
          />
          {{ '@' + usuario.nombreUsuario }}
        </span>
        <button class="btn btn-fantasma" (click)="cerrarSesion()">Salir</button>
      } @else {
        <a routerLink="/login" routerLinkActive="activo">Ingresar</a>
        <a routerLink="/registro" class="btn btn-primario boton-registro">Crear cuenta</a>
      }
    </nav>
  </div>
</header>
